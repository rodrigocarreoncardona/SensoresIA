name: CI/CD Pipeline for FastAPI to Azure

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. PRUEBAS Y ANÁLISIS ESTÁTICO
  # ==========================================
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Versión recomendada y estable para Azure App Service
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instalamos herramientas de análisis estático (equivalentes a Pint y PHPStan)
          pip install black flake8 pytest

  # ==========================================
  # 2. CONSTRUCCIÓN DEL ARTEFACTO (Producción)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: static-analysis
    if: github.ref == 'refs/heads/main' # Solo se construye si los cambios llegan a main
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A diferencia de Composer, delegamos el 'pip install' a Azure (Oryx build)
      # para garantizar que las dependencias de C (como Pandas) se compilen
      # correctamente en el entorno nativo de destino.
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.git/
            !__pycache__/

  # ==========================================
  # 3. DESPLIEGUE EN AZURE
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sensores' # REEMPLAZA ESTO CON EL NOMBRE DE TU APP EN AZURE
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .